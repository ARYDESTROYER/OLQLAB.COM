name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-only-secret-that-is-longer-than-32-characters
      NEXTAUTH_URL: https://ci.example.com
      REPORT_SHARE_BASE_URL: https://ci.example.com
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: noreply@example.com
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_placeholder
      OPENAI_API_KEY: openai-ci-placeholder
      REPORT_LLM_MODEL: gpt-4o-mini
      INTERNAL_JOB_SECRET: ci-internal-job-secret-longer-than-32-characters
      CRON_SECRET: ci-cron-secret-different-and-longer-than-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment environment
        run: npm run env:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Reconstruct and seed database
        run: |
          npm run prisma:migrate:deploy
          npm run prisma:seed

      - name: Detect migration drift
        run: >-
          npx prisma migrate diff
          --from-url "$DIRECT_DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Build
        run: npm run build

      - name: Smoke-test production health endpoints
        run: |
          set -euo pipefail
          npm run start > /tmp/olqlab-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          health_payload="$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://localhost:3000/api/health)"
          readiness_payload="$(curl --fail --silent --show-error http://localhost:3000/api/health/ready)"
          test "$health_payload" = '{"status":"ok"}'
          test "$readiness_payload" = '{"status":"ready","checks":{"database":"ok"}}'
